version: '3.4'
services:
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    healthcheck:
      # Healthy once start.d has subscribed the FIS simulator's queue to its topic.
      test: aws --endpoint-url=http://localhost:4566 sns list-subscriptions | grep -q trade_imports_iuunotification_sim_upserted_queue
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 10
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ################################################################################

  # trade-imports-fis-simulator-api, as CDP publishes it. Set TRADE_IMPORTS_FIS_SIMULATOR_API to run another
  # version. It stores notifications in mongodb and publishes them to floci's SNS.
  fis-simulator-api:
    image: defradigital/trade-imports-fis-simulator-api:${TRADE_IMPORTS_FIS_SIMULATOR_API:-latest}
    ports:
      - '8085:8085'
    depends_on:
      mongodb:
        condition: service_healthy
      floci:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
      - 'compose/fis-simulator-api.env'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8085/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - cdp-tenant

  simulator-frontend:
    build: ./
    ports:
      - '3000:3000'
    links:
      - 'floci:floci'
      - 'redis:redis'
    depends_on:
      floci:
        condition: service_healthy
      redis:
        condition: service_started
      fis-simulator-api:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3000
      NODE_ENV: production
      REDIS_HOST: redis
      LOG_FORMAT: pino-pretty
      SESSION_COOKIE_SECURE: false
      USE_SINGLE_INSTANCE_CACHE: true
      REDIS_TLS: false
      FIS_SIMULATOR_ENABLED: true
      FIS_SIMULATOR_URL: http://fis-simulator-api:8085
    networks:
      - cdp-tenant

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
